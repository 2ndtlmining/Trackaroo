<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0f1117" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="preload" as="font" type="font/woff2" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" crossorigin />
		<link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage-grotesque-latin-800-normal.woff2" crossorigin />
		%sveltekit.head%
		<script>
			try {
				const saved = localStorage.getItem('trackaroo-theme');
				document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
			} catch {
				document.documentElement.dataset.theme = 'dark';
			}
			// Browser chrome follows the theme before first paint (#25).
			// Keep these two colours in step with THEME_COLORS in src/lib/theme.ts.
			document
				.querySelector('meta[name="theme-color"]')
				?.setAttribute('content', document.documentElement.dataset.theme === 'light' ? '#f6f7f9' : '#0f1117');
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
