<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Something went wrong · Trackaroo</title>
		<!--
			SvelteKit's fallback page (#29): used when the error happens in the root
			layout itself, most often because getDb() cannot open trackaroo.db, so
			+error.svelte (which renders inside that layout) cannot. Static: no app
			code, no external assets. Colours mirror app.css; dark is the site
			default, light follows the OS.
		-->
		<style>
			:root {
				color-scheme: dark;
				--bg: #0f1117;
				--surface: #161923;
				--border: #262b3a;
				--text: #e4e6ef;
				--text-muted: #8b8fa3;
				--accent: #4f8cff;
			}
			@media (prefers-color-scheme: light) {
				:root {
					color-scheme: light;
					--bg: #f6f7f9;
					--surface: #ffffff;
					--border: #e2e5ea;
					--text: #1a1d27;
					--text-muted: #666c7b;
					--accent: #1d4ed8;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 16px;
				background: var(--bg);
				color: var(--text);
				font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
			}
			main {
				width: 100%;
				max-width: 36rem;
				text-align: center;
			}
			.wordmark {
				margin: 0 0 2rem;
				font: 700 1.75rem/1 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;
				letter-spacing: -0.02em;
			}
			.wordmark span {
				color: var(--accent);
			}
			h1 {
				margin: 0 0 0.5rem;
				font-size: 1.5rem;
			}
			.message {
				margin: 0;
				color: var(--text);
			}
			.hint {
				margin: 1rem 0 0;
				font-size: 0.875rem;
				color: var(--text-muted);
			}
			code {
				font-family: 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace;
				font-size: 0.85em;
				padding: 0.1em 0.35em;
				border: 1px solid var(--border);
				border-radius: 4px;
				background: var(--surface);
			}
			.actions {
				margin-top: 2rem;
				display: flex;
				justify-content: center;
				gap: 0.75rem;
			}
			.actions a {
				padding: 0.5rem 0.75rem;
				border-radius: 6px;
				font-size: 0.875rem;
				text-decoration: none;
				color: var(--text-muted);
			}
			.actions a.primary {
				border: 1px solid var(--border);
				background: var(--surface);
				color: var(--text);
			}
			.actions a:hover {
				color: var(--text);
			}
			.status {
				margin-top: 1.5rem;
				font-size: 0.75rem;
				color: var(--text-muted);
				font-variant-numeric: tabular-nums;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="wordmark">trackaroo<span>_</span></p>
			<h1>Something went wrong</h1>
			<p class="message">%sveltekit.error.message%</p>
			<p class="hint">
				If the database could not be opened, run <code>python seed.py</code> (and
				<code>python run_daily.py</code> for data), or check that <code>TRACKAROO_DB</code> points
				at the right file. If the schema is out of date, run <code>python migrate.py</code>.
			</p>
			<div class="actions">
				<a class="primary" href="">Try again</a>
				<a href="/">Home</a>
			</div>
			<p class="status">%sveltekit.status%</p>
		</main>
	</body>
</html>
